<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Lane</title>
<meta name="description" content="Year by year.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Caveat:wght@400;600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/scrapbook.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <span class="topbar__title">The Birthday Archive</span>
  <button class="burger" type="button" data-burger aria-label="Open menu">Menu</button>
</header>

<div class="shell">
  <nav class="sidebar" data-nav aria-label="Scrapbook sections"></nav>

  <main class="main">
    <header class="pagehead">
      <p class="eyebrow">Chapter Two</p>
      <h1 class="display">Memory lane</h1>
      <p class="hand scribble">the long version, for people who were there.</p>
    </header>

    <div class="duo" style="align-items:start;gap:56px">
      <section class="timeline" data-render="timeline"></section>

      <aside class="stack-lg" style="position:sticky;top:32px">
        <figure class="polaroid reveal" style="margin:0;transform:rotate(2deg)">
          <span class="tape tape--top" aria-hidden="true"></span>
          <div class="photo photo--square photo-slot">
            <p class="photo-slot__hint">the oldest photo you can find</p>
          </div>
          <figcaption>where it started</figcaption>
        </figure>

        <div class="note reveal">
          <p class="hand" style="font-size:1.35rem;margin:0">
            &ldquo;We were so young and so certain we knew everything.&rdquo;
          </p>
          <p class="label" style="color:var(--primary);margin-top:14px">&mdash; all of us, wrongly</p>
        </div>
      </aside>
    </div>

    <footer class="footer">
      <p data-text="footer">made with too much love and not enough sleep &hearts;</p>
    </footer>
  </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/scrapbook.js"></script>
</body>
</html>
