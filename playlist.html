<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mixtape</title>
<meta name="description" content="Songs that are legally about her.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Caveat:wght@400;600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/scrapbook.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <span class="topbar__title">The Birthday Archive</span>
  <button class="burger" type="button" data-burger aria-label="Open menu">Menu</button>
</header>

<div class="shell">
  <nav class="sidebar" data-nav aria-label="Scrapbook sections"></nav>

  <main class="main">
    <header class="pagehead">
      <p class="eyebrow">Side A</p>
      <h1 class="display" data-text="playlistTitle">Songs that are legally about you</h1>
      <p class="hand scribble">for the car, the kitchen, and the 2am walk home.</p>
    </header>

    <div class="duo" style="align-items:start;gap:48px">
      <section>
        <div class="tracks" data-render="tracks"></div>
        <p style="margin-top:28px">
          <a class="tape-btn" href="final.html">Side B: the surprise &rarr;</a>
        </p>
      </section>

      <aside class="cassette reveal">
        <p class="label" style="color:var(--blush)">Mixtape &mdash; do not tape over</p>
        <h2 class="headline" style="color:#ffdada;font-size:1.5rem">
          for <span data-text="name">you</span>
        </h2>
        <div class="cassette__reels" aria-hidden="true">
          <span class="reel"></span>
          <span class="reel" style="animation-duration:4.6s"></span>
        </div>
        <p class="hand" style="color:var(--blush);text-align:center;margin:0">
          play loud. sing badly.
        </p>
        <p class="center" style="margin:20px 0 0" data-render="playlistLink"></p>
      </aside>
    </div>

    <footer class="footer">
      <p data-text="footer">made with too much love and not enough sleep &hearts;</p>
    </footer>
  </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/scrapbook.js"></script>
</body>
</html>
