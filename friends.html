<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Friends Archive</title>
<meta name="description" content="The people who had the privilege of knowing her.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Caveat:wght@400;600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/scrapbook.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <span class="topbar__title">The Birthday Archive</span>
  <button class="burger" type="button" data-burger aria-label="Open menu">Menu</button>
</header>

<div class="shell">
  <nav class="sidebar" data-nav aria-label="Scrapbook sections"></nav>

  <main class="main">
    <header class="pagehead">
      <span class="tape tape--wide" style="top:0;left:8%" aria-hidden="true"></span>
      <span class="tape tape--blush tape--wide" style="top:14px;right:6%" aria-hidden="true"></span>

      <p class="eyebrow">Chapter One</p>
      <h1 class="display">The people who had the privilege of knowing <span data-text="name">her</span></h1>
      <p class="hand scribble">aka the people who survived <span data-text="name">her</span>.</p>
    </header>

    <div class="rail" data-render="friendTags" role="group" aria-label="Filter friends"></div>

    <section class="collage" style="margin-top:40px" data-render="friends"></section>

    <p class="center" style="margin-top:48px">
      <a class="ghost-btn" href="wishes.html">&#43; Add yourself to the archive</a>
    </p>

    <footer class="footer">
      <p data-text="footer">made with too much love and not enough sleep &hearts;</p>
    </footer>
  </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/scrapbook.js"></script>
</body>
</html>
